[custom]

# 日常代理入口：直连 / 手动选择 / 全部节点自动测速
custom_proxy_group=🚀 节点选择`select`[]DIRECT`[]🧭 手动选节点`[]♻️ 全部节点自动

# 手动选择：所有节点
