[custom]

# 日常代理入口：直连 / 手动选择 / 自动测速（仅匹配指定节点）
custom_proxy_group=🚀 节点选择`select`[]DIRECT`[]🧭 手动选节点`[]♻️ 自动测速

# 手动选择：所有节点
custom_proxy_group=🧭 手动选节点`select`.*

# AI 专用入口：手动选择 / 自动测速（仅匹配指定节点）
custom_proxy_group=🤖 AI 专用`select`[]🧭 手动选节点`[]♻️ 自动测速

# 自动测速：仅匹配节点名称包含 AWS新加坡、AWS日本 或 高速专线-hy2 的节点
custom_proxy_group=♻️ 自动测速`url-test`(AWS新加坡|AWS日本|高速专线-hy2)`https://www.gstatic.com/generate_204`300,,100

enable_rule_generator=false
overwrite_original_rules=true
