[custom]

; =====================================================
; 1. 局域网 / 私有网络
; =====================================================
ruleset=DIRECT,[]GEOSITE,private

; =====================================================
; 2. 广告拦截
; =====================================================
ruleset=REJECT,[]GEOSITE,category-ads-all

; =====================================================
; 3. AI 专用（必须代理）
; =====================================================
ruleset=🤖 AI,[]GEOSITE,category-ai-!cn
ruleset=🤖 AI,[]GEOSITE,openai
ruleset=🤖 AI,[]GEOSITE,anthropic
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,claude.ai

; =====================================================
; 4. 流媒体（必须代理）
; =====================================================
ruleset=🎬 STREAM,[]GEOSITE,netflix
ruleset=🎬 STREAM,[]GEOSITE,disney
ruleset=🎬 STREAM,[]GEOSITE,primevideo
ruleset=🎬 STREAM,[]GEOSITE,hbo
ruleset=🎬 STREAM,[]GEOSITE,youtube
ruleset=🎬 STREAM,[]GEOSITE,spotify
ruleset=🎬 STREAM,[]GEOSITE,telegram

; =====================================================
; 5. Google 强制代理
; =====================================================
ruleset=🎯 PROXY,[]GEOSITE,google

; =====================================================
; 6. 中国直连
; =====================================================
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,CN,no-resolve

; =====================================================
; 7. 兜底（防泄露）
; =====================================================
ruleset=🎯 PROXY,[]FINAL


; =====================================================
; 代理组（稳定结构）
; =====================================================

custom_proxy_group=🎯 PROXY`select`[]♻️ AUTO`[]DIRECT`.*

custom_proxy_group=♻️ AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; =========================
; AI（稳定优先，不自动乱跳）
; =========================
custom_proxy_group=🤖 AI`select`[]🇺🇸 US`[]🇸🇬 SG`[]🇯🇵 JP`[]♻️ AUTO`.*

; =========================
; 流媒体（解锁优先）
; =========================
custom_proxy_group=🎬 STREAM`select`[]🇺🇸 US`[]🇭🇰 HK`[]🇯🇵 JP`[]♻️ AUTO`.*

; =========================
; 国家节点池
; =========================
custom_proxy_group=🇺🇸 US`select`.*
custom_proxy_group=🇭🇰 HK`select`.*
custom_proxy_group=🇯🇵 JP`select`.*
custom_proxy_group=🇸🇬 SG`select`.*

; =====================================================
enable_rule_generator=true
overwrite_original_rules=true